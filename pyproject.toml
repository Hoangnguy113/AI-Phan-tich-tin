[project]
name = "agnet"
version = "0.1.0"
description = "Agnet - he thong da agent san xu huong & viet kich ban dao dien video"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "claude-agent-sdk>=0.2.127",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PySide6>=6.6"]

[project.scripts]
agnet = "agnet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
